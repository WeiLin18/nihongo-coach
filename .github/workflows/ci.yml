# Lint, type check, build and the headless checks on every PR and on pushes to main.
# Uses no secrets, so it is safe for PRs from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: Pitch analysis check
        run: node scripts/check-pitch.ts
      - name: Migration numbering check
        run: node scripts/check-migrations.ts
