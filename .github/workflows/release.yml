# Runs when a vX.Y.Z tag is pushed (normally by `npm run release`):
#   verify  → the same checks as CI, and the tag matches package.json
#   release → GitHub Release with that version's CHANGELOG section as notes
#   deploy  → waits for approval on the `production` environment, records a D1
#             Time Travel point, applies remote D1 migrations, then deploys the Worker
#
# The database is never exported here: this repo is public, and Actions logs and
# artifacts are readable by anyone. Restore points come from D1 Time Travel instead
# (see docs/RELEASING.md). The app URL is filtered out of the deploy log.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
      - name: CHANGELOG has notes for this version
        run: node scripts/release.ts notes "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Is this the newest version tag?
        id: newest
        run: |
          latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$GITHUB_REF_NAME is older than $latest, so it will not be deployed. Production keeps $latest."
          fi
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: Pitch analysis check
        run: node scripts/check-pitch.ts
      - name: Migration numbering check
        run: node scripts/check-migrations.ts

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ needs.verify.outputs.newest }}
        run: |
          node scripts/release.ts notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest="$NEWEST"
          fi

  deploy:
    needs: verify
    if: needs.verify.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Record a D1 restore point
        run: |
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bookmark="$(npx wrangler d1 time-travel info nihongo-coach --json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).bookmark ?? ""))')" || bookmark=""
          {
            echo "### D1 restore point before $GITHUB_REF_NAME"
            echo
            echo "- Time: \`$ts\`"
            echo "- Bookmark: \`${bookmark:-unavailable}\`"
            echo
            echo "Restore with \`npx wrangler d1 time-travel restore nihongo-coach --timestamp=$ts\`"
            echo "(or \`--bookmark=<bookmark>\`). See docs/RELEASING.md before you do."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pending migrations
        run: npx wrangler d1 migrations list nihongo-coach --remote
      - name: Apply migrations
        run: npx wrangler d1 migrations apply nihongo-coach --remote
      - name: Build and deploy the Worker
        # bash runs with pipefail, so a failed deploy still fails the step.
        run: npm run deploy 2>&1 | sed -E 's#https?://[^[:space:]]*workers\.dev[^[:space:]]*#<app url hidden>#g'
